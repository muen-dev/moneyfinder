[project]
name = "business-research"
version = "0.1.0"
description = "Business context gathering for moneyfinder: Gmail connector and company-domain signup with public-data research."
authors = [
    { name = "NicholasSutin", email = "nicholas0sutin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "company-research",
    "legal-research",
    "flask>=3.1.3",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "oauthlib>=4.0.0",
]

[project.scripts]
business-research = "business_research.cli:main"

[tool.uv.sources]
company-research = { path = "../company", editable = true }
legal-research = { path = "../legal", editable = true }

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
