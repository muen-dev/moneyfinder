<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Business inbox{% endblock %} · moneyfinder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <a href="{{ url_for('index') }}" class="brand">moneyfinder</a>
    <span class="muted">business inbox · local dev</span>
  </header>
  <main>
    {% with flashes = get_flashed_messages(with_categories=true) %}
      {% for category, text in flashes %}<p class="flash {{ category }}">{{ text }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
