[project]
name = "legal-research"
version = "0.1.0"
description = "Tax-credit program catalog for moneyfinder: official links, page data, claim counts and niches for NY, NYC and federal credits."
authors = [
    { name = "NicholasSutin", email = "nicholas0sutin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "moneyfinder-kb",
]

[project.scripts]
legal-research = "legal_research.cli:main"

[tool.uv.sources]
moneyfinder-kb = { path = "../../kb", editable = true }

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
