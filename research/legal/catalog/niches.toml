# Niches: who a credit is really for. Most credits only make sense for one kind of business or one hiring
# situation, and those are the ones small businesses miss.
#
# A program joins a niche when its name (or another name it goes by) matches one of `name_patterns`
# (case-insensitive regex), or when programs.toml lists the niche for it.
# `naics` (code prefixes) and `profile_keywords` are for matching a research/company profile to niches.
# A niche that groups several topics adds a `[niche.program_keywords]` table (program id = keywords): for those
# programs only their own keywords count, so "solar" does not match the bioheat credit. NAICS matches still count.
# `search` is the query `legal-research run --search` sends to find programs the index pages miss.

# Industries

[[niche]]
id = "restaurants_hospitality"
label = "Restaurants, bars and tipped staff"
description = "Food and drink businesses, and any business whose staff receive tips."
naics = ["722"]
name_patterns = ['\brestaurant', '\btipped\b', '\btips\b']
profile_keywords = ["restaurant", "bar", "cafe", "pizzeria", "bakery", "catering", "diner", "coffee", "salon", "barber"]
search = "New York restaurant tax credit employer"

[[niche]]
id = "beverage_alcohol"
label = "Breweries, wineries, distilleries and cideries"
description = "Producers of beer, wine, cider, mead and spirits in New York."
naics = ["31212", "31213", "31214"]
name_patterns = ['alcoholic beverage', '\bbeer\b', '\bbrew', '\bwine', 'distill']
profile_keywords = ["brewery", "brewing", "winery", "distillery", "cidery", "craft beer", "spirits"]

[[niche]]
id = "film_tv"
label = "Film, TV and commercial production"
description = "Productions shot or post-produced in New York, including TV commercials."
